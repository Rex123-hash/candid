    <text x="28" y="44" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#6b6257" letter-spacing="1.5">MAPLE LANE FARM STAND</text>
    <g font-family="'Schibsted Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#16130f">
      <text x="28" y="92">Free-range eggs</text><text x="392" y="92" text-anchor="end">$6.00</text>
      <text x="28" y="128">Wildflower honey x 2</text><text x="392" y="128" text-anchor="end">$18.00</text>
    </g>
