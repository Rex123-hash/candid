    <text x="392" y="190" text-anchor="end" font-family="'Schibsted Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#16130f">$24.00</text>
    <g font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#6b6257">
