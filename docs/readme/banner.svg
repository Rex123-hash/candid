  </defs>
  <rect width="1200" height="400" rx="22" fill="url(#glow)"/>
  <rect width="1200" height="400" rx="22" fill="url(#grain)"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="22" fill="none" stroke="#e2d9c8"/>

  <g fill="none" stroke="#16130f" stroke-width="5" stroke-linecap="round">
    <path d="M80 116V96a16 16 0 0 1 16-16h20"/>
