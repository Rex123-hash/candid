  <text x="112" y="214" font-family="'Schibsted Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="112" font-weight="800" letter-spacing="-5" fill="#16130f">Candid</text>
  <circle cx="522" cy="204" r="13" fill="#f5a524"/>
  <text x="84" y="330" font-family="'Schibsted Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#16130f">Snap what you take. Pay. Go.</text>
  <text x="84" y="366" font-family="'Schibsted Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#6b6257">Checkout for farm stands and honesty boxes with nobody at the till.</text>

  <g transform="translate(700 55)">
