      <stop offset="1" stop-color="#efe9de"/>
    </radialGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#16130f" opacity="0.05"/>
